<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>智伴晚晴 · 青年助老驿站</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .home-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 80px 16px 40px; position: relative; z-index: 1;
    }
    .home-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 48px 40px; max-width: 780px; width: 100%; text-align: center;
      animation: fadeInUp 0.7s ease forwards;
      border: 1px solid var(--border);
    }
    .home-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; font-size: 12px; font-weight: 600;
      padding: 5px 16px; border-radius: var(--radius-full);
      letter-spacing: 0.5px; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .home-logo { font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1.2; margin-bottom: 6px; }
    .home-logo .highlight {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .home-sub { font-size: 18px; color: var(--text-secondary); margin-bottom: 4px; transition: opacity 0.35s; min-height: 28px; font-weight: 400; }
    .home-clock {
      display: inline-block;
      background: var(--bg-glass);
      color: var(--text-secondary);
      font-size: 14px; font-weight: 500;
      padding: 8px 20px; border-radius: var(--radius-full);
      margin: 10px 0 24px; backdrop-filter: blur(8px);
      border: 1px solid var(--border);
    }
    .role-cards { display: flex; gap: var(--space-md); margin-bottom: 24px; }
    .role-card .btn { margin-top: 4px; }

    .voice-section {
      background: var(--bg-glass);
      border-radius: var(--radius);
      padding: 20px; margin-bottom: 16px;
      border: 1px dashed var(--border);
      backdrop-filter: blur(8px);
    }

    .home-footer { font-size: 13px; color: var(--text-muted); margin-top: 16px; }

    @media (max-width: 576px) {
      .home-card { padding: 28px 18px; border-radius: var(--radius); }
      .role-cards { flex-direction: column; }
      .home-logo { font-size: 30px; }
      .home-sub { font-size: 15px; }
    }

    /* Entrance stagger */
    .role-card { opacity: 0; animation: fadeInUp 0.5s ease forwards; }
    .role-card:nth-child(1) { animation-delay: 0.15s; }
    .role-card:nth-child(2) { animation-delay: 0.3s; }
    .role-card:nth-child(3) { animation-delay: 0.45s; }

    /* Floating particles background */
    .home-bg-particles {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .particle {
      position: absolute; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      opacity: 0.06; animation: float 20s infinite ease-in-out;
    }
    .particle:nth-child(1) { width: 300px; height: 300px; top: -10%; left: -5%; animation-duration: 25s; }
    .particle:nth-child(2) { width: 200px; height: 200px; bottom: -5%; right: -3%; animation-duration: 20s; animation-delay: -5s; }
    .particle:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 50%; animation-duration: 30s; animation-delay: -10s; }
    .particle:nth-child(4) { width: 100px; height: 100px; top: 20%; right: 10%; animation-duration: 18s; animation-delay: -3s; }
    .particle:nth-child(5) { width: 250px; height: 250px; bottom: 20%; left: 10%; animation-duration: 22s; animation-delay: -8s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -40px) scale(1.05); }
      50% { transform: translate(-20px, -60px) scale(0.95); }
      75% { transform: translate(40px, 20px) scale(1.02); }
    }

    [data-theme="dark"] .particle { opacity: 0.08; }
  </style>
</head>
<body>
  <div class="home-bg-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <button class="theme-btn" onclick="toggleTheme()" title="切换深浅色模式">🌙</button>

  <div class="home-wrap">
    <div class="home-card">
      <div class="home-badge">✦ 响应十五五规划 · AI赋能助老</div>
      <div class="home-sub" id="slogan">用青春的双手，托起长辈的数字晴空</div>
      <h1 class="home-logo">智伴晚晴<br/><span class="highlight">青年助老驿站</span></h1>
      <div class="home-clock" id="currentTime">--</div>

      <div class="role-cards">
        <div class="role-card elder" onclick="goTo('elder/login.html')">
          <div class="icon">👴</div>
          <h2>我是老人</h2>
          <p>发布需求·AI陪伴<br/>学习教程·查看服务</p>
          <button class="btn btn-elder btn-sm">快捷验证 →</button>
        </div>
        <div class="role-card volunteer" onclick="goTo('volunteer/login.html')">
          <div class="icon">💚</div>
          <h2>我是志愿者</h2>
          <p>接单服务·管理订单<br/>上传教程·参与培训</p>
          <button class="btn btn-volunteer btn-sm">登录/注册 →</button>
        </div>
        <div class="role-card admin" onclick="goTo('admin/login.html')">
          <div class="icon">⚙️</div>
          <h2>我是管理员</h2>
          <p>用户审核·订单管理<br/>数据统计·内容管控</p>
          <button class="btn btn-admin btn-sm">后台登录 →</button>
        </div>
      </div>

      <div class="voice-section">
        <button class="voice-btn-lg" id="voiceBtn">🎤 说出您的身份</button>
        <div class="voice-status" id="voiceStatus">支持语音识别 — 说"我是老人""我是志愿者"或"我是管理员"</div>
      </div>

      <div class="home-footer">© 2026 智伴晚晴 · 青年助老驿站</div>
    </div>
  </div>

  <div class="toast"></div>
  <script src="assets/app.js"></script>
  <script>
    const slogans = [
      "用青春的双手，托起长辈的数字晴空",
      "青春暖夕阳，志愿伴安康",
      "以青春之名，赴温暖之约",
      "银发需呵护，青春来相助",
      "青春力量护桑榆，志愿真情暖人心"
    ];
    let si = 0;
    function rotateSlogan() {
      const el = document.getElementById('slogan');
      si = (si + 1) % slogans.length;
      el.style.opacity = 0;
      setTimeout(() => { el.textContent = slogans[si]; el.style.opacity = 1; }, 300);
    }

    async function startVoiceRecognition() {
      const btn = document.getElementById('voiceBtn');
      const status = document.getElementById('voiceStatus');
      if (btn.classList.contains('recording')) return;
      if (!navigator.mediaDevices || !MediaRecorder) {
        status.textContent = '❌ 您的设备不支持语音录制';
        status.className = 'voice-status error'; speak('您的设备不支持语音录制'); return;
      }
      btn.textContent = '🎙️ 录音中...';
      btn.classList.add('recording');
      status.textContent = '请说出您的身份（3秒）...';
      status.className = 'voice-status recording';
      speak('请说出您的身份');
      try {
        const { stop } = await captureAudio();
        setTimeout(async () => {
          try {
            status.textContent = '正在处理音频...';
            const audioBase64 = await stop();
            btn.classList.remove('recording'); btn.classList.add('recognizing');
            status.textContent = '正在识别...'; status.className = 'voice-status recognizing';
            const transcript = await recognizeWithBaidu(audioBase64);
            status.textContent = `✅ 识别结果："${transcript}"`;
            status.className = 'voice-status success'; btn.textContent = '✅ 识别成功';
            const t = transcript.trim();
            if (/老人|老年人|老人家/.test(t)) { speak('已识别为老人，正在跳转'); setTimeout(() => goTo('elder/login.html'), 1200); }
            else if (/志愿者|志愿|义工/.test(t)) { speak('已识别为志愿者，正在跳转'); setTimeout(() => goTo('volunteer/login.html'), 1200); }
            else if (/管理员|管理|后台/.test(t)) { speak('已识别为管理员，正在跳转'); setTimeout(() => goTo('admin/login.html'), 1200); }
            else { throw new Error('未识别到有效身份（听到："' + transcript + '"）'); }
          } catch(e) {
            btn.classList.remove('recording','recognizing'); btn.textContent = '🎤 再次说话';
            status.textContent = '❌ ' + e.message; status.className = 'voice-status error'; speak(e.message);
          }
        }, 3000);
      } catch(e) {
        btn.classList.remove('recording','recognizing'); btn.textContent = '🎤 录音失败';
        let msg = e.message || '无法启动音频源';
        if (msg.includes('denied') || msg.includes('not allowed')) msg = '麦克风权限被拒绝';
        status.textContent = '❌ ' + msg; status.className = 'voice-status error'; speak(msg);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme(); startClock();
      document.getElementById('voiceBtn').addEventListener('click', startVoiceRecognition);
      setInterval(rotateSlogan, 5000);
      setTimeout(() => speak('欢迎来到智伴晚晴青年助老驿站，请选择或说出您的身份'), 800);
    });
  </script>
</body>
</html>
