<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>管理员登录 · 智伴晚晴</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    .admin-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:80px 20px 40px; }
    .admin-card { background:var(--bg-card); border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,0.08); padding:40px 36px; max-width:420px; width:100%; border:1px solid var(--border); animation:fadeInUp 0.6s ease forwards; }
    .admin-hdr { text-align:center; margin-bottom:28px; }
    .admin-hdr .icon { width:72px;height:72px;border-radius:50%;background:var(--admin-light);color:var(--admin);display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:12px; }
    .admin-hdr h1 { font-size:26px;font-weight:700; }
    .admin-hdr p { color:var(--text-secondary);font-size:14px;margin-top:4px; }
    .tip-box { background:var(--admin-light);border-left:4px solid var(--admin);padding:12px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:14px;line-height:1.6;margin-bottom:24px;color:var(--text-secondary); }
    .back-link { text-align:center;margin-top:20px;font-size:14px; }
    .back-link a { color:var(--admin);cursor:pointer; }
  </style>
</head>
<body>
  <button class="back-btn" onclick="goTo('../index.html')">←</button>
  <div class="admin-wrap">
    <div class="admin-card">
      <div class="admin-hdr">
        <div class="icon">🔐</div>
        <h1>管理员登录</h1>
        <p>智伴晚晴 · 管理后台</p>
      </div>
      <div class="tip-box">管理员账户具备用户审核、订单管理、内容管控等高级权限，请妥善保管账号。</div>
      <div class="form-group"><label>手机号 <span class="required">*</span></label><input type="tel" id="phone" placeholder="管理员手机号" maxlength="11" /></div>
      <div class="form-group"><label>密码 <span class="required">*</span></label><input type="password" id="pwd" placeholder="密码（6-16位）" /></div>
      <div class="form-group"><label>验证码 <span class="required">*</span></label>
        <div class="captcha-row">
          <input type="text" id="captcha" placeholder="6位验证码" maxlength="6" inputmode="numeric" />
          <button class="captcha-btn" style="background:var(--admin);" onclick="getCaptcha()">获取验证码</button>
        </div>
      </div>
      <div style="text-align:right;margin-bottom:20px;"><a style="color:var(--admin);font-size:14px;cursor:pointer;" onclick="showToast('请联系超级管理员重置密码')">忘记密码？</a></div>
      <button class="btn btn-admin btn-block btn-lg" onclick="handleLogin()">立即登录</button>
      <div class="back-link"><a onclick="goTo('../volunteer/login.html')">← 返回志愿者登录</a></div>
    </div>
  </div>
  <div class="toast"></div>
  <script src="../assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { initTheme(); document.getElementById('phone').focus(); });

    function getCaptcha() {
      const p = document.getElementById('phone').value;
      if (!/^1[3-9]\d{9}$/.test(p)) { showToast('请输入正确的手机号','error'); return; }
      setCaptcha('admin');
      startCountdown(document.querySelector('.captcha-btn'));
      showToast('✅ 验证码已发送（演示模式）','success');
    }

    function handleLogin() {
      const p = document.getElementById('phone').value;
      const pw = document.getElementById('pwd').value;
      const c = document.getElementById('captcha').value;
      if (!p||!pw||!c) { showToast('请填写完整信息','error'); return; }
      if (!/^1[3-9]\d{9}$/.test(p)) { showToast('手机号格式错误','error'); return; }
      if (pw.length<6||pw.length>16) { showToast('密码长度6-16位','error'); return; }
      if (c !== getStoredCaptcha('admin')) { showToast('验证码错误或已过期','error'); return; }
      showToast('✅ 登录成功','success');
      setTimeout(() => goTo('dashboard.html'), 800);
    }
  </script>
</body>
</html>
