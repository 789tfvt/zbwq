<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>需求大厅 · 智伴晚晴</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    .title-header { text-align:center; padding:20px 0; }
    .title-header h1 { font-size:32px; color:var(--volunteer); }
    .filter-bar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .filter-bar select,.filter-bar input { flex:1; min-width:140px; }
    .demand-list { display:flex; flex-direction:column; gap:16px; }
    .demand-card { background:var(--bg-card); border-radius:6px; padding:24px 28px; box-shadow:var(--shadow); border:3px solid var(--border); transition:var(--transition); }
    .demand-card:hover { box-shadow:var(--shadow-hover); }
    .demand-card .top { display:flex; justify-content:space-between; align-items:start; margin-bottom:8px; }
    .demand-card h4 { font-size:20px; font-weight:600; }
    .demand-card .meta { display:flex; gap:16px; font-size:14px; color:var(--text-secondary); flex-wrap:wrap; }
    .demand-card .actions { margin-top:12px; display:flex; gap:10px; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
    .empty-state .icon { font-size:48px; margin-bottom:12px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <ul class="nav-list">
      <li class="nav-item"><a href="dashboard.html">首页</a></li>
      <li class="nav-item"><a href="demand.html" class="active">需求大厅</a></li>
      <li class="nav-item"><a href="services.html">服务管理</a></li>
      <li class="nav-item"><a href="guide.html">志愿者指南</a></li>
    </ul>
  </nav>
  <div class="container">
    <div class="title-header"><h1>📋 需求大厅</h1></div>
    <div class="filter-bar">
      <select id="filterArea"><option value="">全部地区</option><option>北京市</option><option>上海市</option><option>广东省</option><option>江苏省</option><option>浙江省</option></select>
      <select id="filterType"><option value="">全部类型</option><option>手机教学</option><option>生活服务</option><option>家电维修</option><option>健康陪伴</option></select>
      <select id="filterUrgency"><option value="">全部紧急度</option><option value="紧急">紧急</option><option value="普通">普通</option><option value="可延后">可延后</option></select>
      <input type="text" id="filterSearch" placeholder="搜索老人姓名或地址..." oninput="applyFilters()" />
    </div>
    <div class="demand-list" id="demandList"></div>
    <div class="text-center mt-24" style="color:var(--text-muted);font-size:14px;" id="endMarker">—— 加载完成 ——</div>
  </div>
  <div class="toast"></div>
  <script src="../assets/app.js"></script>
  <script>
    const demands = [
      { name:'张奶奶', type:'手机教学', area:'北京市', urgency:'紧急', desc:'教老人使用微信视频通话功能，预计1小时', time:'今天 14:00', age:82 },
      { name:'李爷爷', type:'家电维修', area:'上海市', urgency:'普通', desc:'电风扇不转了，需要上门查看维修', time:'明天 10:00', age:76 },
      { name:'王奶奶', type:'健康陪伴', area:'广东省', urgency:'可延后', desc:'希望志愿者来家里陪聊天、散步，每周一次', time:'周六 15:00', age:68 },
      { name:'赵爷爷', type:'生活服务', area:'浙江省', urgency:'普通', desc:'陪同去医院复查，帮忙挂号取药', time:'周一 09:00', age:71 },
      { name:'刘奶奶', type:'手机教学', area:'北京市', urgency:'紧急', desc:'想学手机拍照和发朋友圈，请上门教学', time:'今天 16:00', age:75 },
      { name:'陈爷爷', type:'家电维修', area:'江苏省', urgency:'普通', desc:'电视机遥控器失灵，需更换或维修', time:'周三 14:30', age:79 },
      { name:'周奶奶', type:'健康陪伴', area:'上海市', urgency:'紧急', desc:'刚出院，需要志愿者陪同复诊和心理疏导', time:'明天 09:00', age:83 },
    ];

    function renderDemands(list) {
      const el = document.getElementById('demandList');
      if (!list.length) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无匹配的需求</p></div>';
        document.getElementById('endMarker').style.display = 'none';
        return;
      }
      document.getElementById('endMarker').style.display = 'block';
      el.innerHTML = list.map(d => {
        const tagClass = d.urgency === '紧急' ? 'tag-danger' : d.urgency === '普通' ? 'tag-warning' : 'tag-volunteer';
        return `<div class="demand-card">
          <div class="top"><h4>${d.name} · ${d.type}</h4><span class="tag ${tagClass}">${d.urgency}</span></div>
          <div class="meta"><span>📍 ${d.area}</span><span>🕐 ${d.time}</span><span>👴 ${d.age}岁</span></div>
          <p class="text-secondary" style="font-size:14px;">${d.desc}</p>
          <div class="actions"><button class="btn btn-volunteer btn-sm" onclick="acceptOrder(this,'${d.name}')">接单</button></div>
        </div>`;
      }).join('');
    }

    function acceptOrder(btn, name) {
      if (btn.disabled) return;
      btn.textContent = '✅ 已接单'; btn.disabled = true;
      showToast(`已接单！请尽快联系${name}老人`,'success');
    }

    function applyFilters() {
      const area = document.getElementById('filterArea').value;
      const type = document.getElementById('filterType').value;
      const urg = document.getElementById('filterUrgency').value;
      const search = document.getElementById('filterSearch').value.toLowerCase();
      const filtered = demands.filter(d => {
        if (area && d.area !== area) return false;
        if (type && d.type !== type) return false;
        if (urg && d.urgency !== urg) return false;
        if (search && !d.name.includes(search) && !d.area.includes(search)) return false;
        return true;
      });
      renderDemands(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderDemands(demands);
      document.querySelectorAll('.filter-bar select').forEach(s => s.addEventListener('change', applyFilters));
    });
  </script>
</body>
</html>
