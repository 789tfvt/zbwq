<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>志愿者登录/注册 · 智伴晚晴</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    .vol-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:80px 20px 40px; }
    .vol-card { background:var(--bg-card); border-radius:6px; box-shadow:0 20px 60px rgba(61,43,31,0.08); padding:44px; max-width:500px; width:100%; border:3px solid var(--border); animation:fadeInUp 0.6s ease forwards; }
    .vol-banner { background:linear-gradient(135deg,var(--volunteer-light),var(--primary-light)); padding:24px; border-radius:6px; margin-bottom:20px; text-align:center; }
    .vol-banner h3 { font-size:18px; color:var(--volunteer-dark); margin-bottom:4px; }
    .vol-banner p { font-size:14px; color:var(--text-secondary); }
    .form-toggle { display:flex; margin-bottom:20px; border-radius:4px; overflow:hidden; border:3px solid var(--border); }
    .form-toggle button { flex:1; padding:14px; font-size:17px; font-weight:600; font-family:var(--font); border:none; cursor:pointer; background:var(--bg); color:var(--text-secondary); transition:var(--transition); }
    .form-toggle button.active { background:var(--volunteer); color:#fff; }
    .section { display:none; }
    .section.active { display:block; }
    .intent-group { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .intent-item { display:flex; align-items:center; gap:6px; padding:8px 14px; border:3px solid var(--border); border-radius:4px; cursor:pointer; font-size:14px; transition:var(--transition); }
    .intent-item:hover { border-color:var(--volunteer); }
    .intent-item input { width:18px; height:18px; min-height:auto; }
    .idcard-upload { border:3px dashed var(--border); border-radius:4px; padding:28px; text-align:center; cursor:pointer; transition:var(--transition); }
    .idcard-upload:hover { border-color:var(--volunteer); }
    .idcard-upload .icon { font-size:32px; color:var(--text-muted); }
    .idcard-upload p { font-size:14px; color:var(--text-secondary); margin-top:4px; }
    .toggle-link { text-align:center; margin-top:20px; font-size:14px; color:var(--text-secondary); }
    .toggle-link a { color:var(--volunteer); cursor:pointer; font-weight:600; }
    .toggle-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <button class="back-btn" onclick="goTo('../index.html')">←</button>
  <div class="vol-wrap">
    <div class="vol-card">
      <div class="vol-banner">
        <h3>💚 青春担当 · 数字助老</h3>
        <p>用你的技能，为长辈撑起一片数字晴空</p>
      </div>
      <div class="form-toggle">
        <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
        <button id="tabRegister" onclick="switchTab('register')">注册</button>
      </div>

      <!-- 登录 -->
      <div class="section active" id="secLogin">
        <div class="text-center mb-24"><h2 style="font-size:28px;">志愿者登录</h2><p class="text-secondary mt-8">欢迎回到智伴晚晴</p></div>
        <div class="form-group"><label>手机号 <span class="required">*</span></label><input type="tel" id="login-phone" placeholder="请输入手机号" maxlength="11" /></div>
        <div class="form-group"><label>密码 <span class="required">*</span></label><input type="password" id="login-pwd" placeholder="6位数字密码" /></div>
        <div class="form-group"><label>验证码 <span class="required">*</span></label>
          <div class="captcha-row">
            <input type="text" id="login-captcha" placeholder="6位验证码" maxlength="6" inputmode="numeric" />
            <button class="captcha-btn" id="getLoginCaptcha" onclick="getCaptcha('login')">获取验证码</button>
          </div>
        </div>
        <button class="btn btn-volunteer btn-block btn-lg" onclick="handleLogin()">立即登录</button>
        <div class="toggle-link">
          <span>没有账号？</span><a onclick="switchTab('register')">立即注册</a>
          <span> | </span><a href="../admin/login.html">管理员登录</a>
        </div>
      </div>

      <!-- 注册 -->
      <div class="section" id="secRegister">
        <div class="text-center mb-24"><h2 style="font-size:28px;">志愿者注册</h2><p class="text-secondary mt-8">加入我们，一起为长辈传递温暖</p></div>
        <div class="form-group"><label>姓名 <span class="required">*</span></label><input type="text" id="reg-name" placeholder="真实姓名" /></div>
        <div class="form-group"><label>手机号 <span class="required">*</span></label><input type="tel" id="reg-phone" placeholder="手机号" maxlength="11" /></div>
        <div class="form-group"><label>身份证号 <span class="required">*</span></label><input type="text" id="reg-idcard" placeholder="18位身份证号" maxlength="18" /></div>
        <div class="form-group"><label>密码 <span class="required">*</span></label><input type="password" id="reg-pwd" placeholder="6位数字密码" /></div>
        <div class="form-group"><label>验证码 <span class="required">*</span></label>
          <div class="captcha-row">
            <input type="text" id="reg-captcha" placeholder="6位验证码" maxlength="6" inputmode="numeric" />
            <button class="captcha-btn" id="getRegCaptcha" onclick="getCaptcha('reg')">获取验证码</button>
          </div>
        </div>
        <div class="form-group"><label>服务意向 <span class="required">*</span></label>
          <div class="intent-group">
            <label class="intent-item"><input type="checkbox" name="intent" value="phone" /> 手机教学</label>
            <label class="intent-item"><input type="checkbox" name="intent" value="life" /> 生活服务</label>
            <label class="intent-item"><input type="checkbox" name="intent" value="repair" /> 家电维修</label>
            <label class="intent-item"><input type="checkbox" name="intent" value="health" /> 健康陪伴</label>
          </div>
        </div>
        <div class="form-group"><label>地区 <span class="required">*</span></label>
          <select id="reg-area"><option value="">请选择</option><option>北京市</option><option>上海市</option><option>广东省</option><option>江苏省</option><option>浙江省</option><option>其他</option></select>
        </div>
        <div class="form-group"><label>实名认证 <span class="required">*</span></label>
          <div class="idcard-upload" onclick="uploadIdcard()"><div class="icon">📄</div><p>点击上传身份证正反面照片</p></div>
        </div>
        <div class="form-group"><label>人脸核验 <span class="required">*</span></label>
          <button class="btn btn-volunteer btn-block" onclick="startFaceCheck()">开始人脸识别核验</button>
        </div>
        <button class="btn btn-block btn-lg" style="background:linear-gradient(90deg,#FF7043,#FF5722);color:#fff;" onclick="handleRegister()">提交注册</button>
        <div class="toggle-link"><span>已有账号？</span><a onclick="switchTab('login')">返回登录</a></div>
      </div>
    </div>
  </div>
  <div class="toast"></div>
  <script src="../assets/app.js"></script>
  <script>
    let idcardOk = false, faceOk = false;
    document.addEventListener('DOMContentLoaded', () => { initTheme(); document.getElementById('login-phone').focus(); });

    function switchTab(t) {
      document.getElementById('secLogin').classList.toggle('active', t === 'login');
      document.getElementById('secRegister').classList.toggle('active', t === 'register');
      document.getElementById('tabLogin').classList.toggle('active', t === 'login');
      document.getElementById('tabRegister').classList.toggle('active', t === 'register');
    }

    function getCaptcha(type) {
      const phone = document.getElementById(type === 'login' ? 'login-phone' : 'reg-phone').value;
      if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的手机号','error'); return; }
      setCaptcha(type);
      startCountdown(document.getElementById(type === 'login' ? 'getLoginCaptcha' : 'getRegCaptcha'));
      showToast('✅ 验证码已发送（演示模式）','success');
    }

    function handleLogin() {
      const p = document.getElementById('login-phone').value;
      const pw = document.getElementById('login-pwd').value;
      const c = document.getElementById('login-captcha').value;
      if (!p || !pw || !c) { showToast('请填写完整信息','error'); return; }
      if (!/^1[3-9]\d{9}$/.test(p)) { showToast('手机号格式错误','error'); return; }
      if (!/^\d{6}$/.test(pw)) { showToast('密码必须为6位数字','error'); return; }
      if (c !== getStoredCaptcha('login')) { showToast('验证码错误或已过期','error'); return; }
      showToast('✅ 登录成功','success');
      setTimeout(() => goTo('dashboard.html'), 800);
    }

    function uploadIdcard() { showToast('已上传身份证照片','success'); idcardOk = true; }
    function startFaceCheck() { showToast('人脸核验通过','success'); faceOk = true; }

    function handleRegister() {
      const n = document.getElementById('reg-name').value;
      const p = document.getElementById('reg-phone').value;
      const id = document.getElementById('reg-idcard').value;
      const pw = document.getElementById('reg-pwd').value;
      const c = document.getElementById('reg-captcha').value;
      const intent = document.querySelectorAll('input[name="intent"]:checked');
      const area = document.getElementById('reg-area').value;
      if (!n||!p||!id||!pw||!c||!intent.length||!area) { showToast('请填写完整信息','error'); return; }
      if (!/^1[3-9]\d{9}$/.test(p)) { showToast('手机号格式错误','error'); return; }
      if (!/^\d{17}[\dXx]$/.test(id)) { showToast('身份证号格式错误','error'); return; }
      if (!/^\d{6}$/.test(pw)) { showToast('密码必须为6位数字','error'); return; }
      if (c !== getStoredCaptcha('reg')) { showToast('验证码错误','error'); return; }
      if (!idcardOk) { showToast('请上传身份证','error'); return; }
      if (!faceOk) { showToast('请完成人脸核验','error'); return; }
      showToast('✅ 注册成功！等待审核','success');
      setTimeout(() => switchTab('login'), 1000);
    }
  </script>
</body>
</html>
